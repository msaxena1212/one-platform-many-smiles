[build]
  command = "npm run build"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GOOGLE_MAPS_API_KEY,SUPABASE_SERVICE_ROLE_KEY,DATABASE_URL"

# SPA fallback — all routes served by index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
